name: Repository quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository structure and syntax
        run: python scripts/validate_repository.py
      - name: Run lightweight tests
        run: python -m unittest discover -s tests -v
